name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 1 * *"   # monthly, 1st of the month, 06:00 UTC: sources
    - cron: "0 7 * * 1"   # weekly, Monday 07:00 UTC: legal watch list
  workflow_dispatch:

jobs:
  scripts:
    # The skill's scripts against the test fixtures (no network beyond localhost).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/seo-geo-audit/run-script-tests.mjs
      - run: node tests/seo-geo-audit/test-apis.mjs
      - run: node tools/sync-libs.mjs --check
      - run: node tests/may-i-scrape/test-verdict.mjs
      - run: node tests/may-i-scrape/test-keywords.mjs
      - run: node tests/may-i-scrape/test-maintenance.mjs
      - run: node tests/may-i-scrape/run-script-tests.mjs

  sources:
    # Are the official sources still where the skill says, and are the facts recent?
    if: github.event.schedule == '0 6 1 * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/seo-geo-audit/check-sources.mjs
      - run: node tests/may-i-scrape/check-sources.mjs

  watch:
    # Decisions announced, pending cases, periodic legal review: one issue per due item.
    if: github.event.schedule == '0 7 * * 1' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/may-i-scrape/check-watch.mjs --create-issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
